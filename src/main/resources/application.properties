spring.application.name=sgi-dp

# CONFIGURACAO BANCO DE DADOS
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# CONFIGURACOES DO HIBERNATE JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

# ENCODING
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# LOGGING
logging.level.org.springframework.security=DEBUG

# CONFIGURACAO DO .ENV PARA SER LEITURA DAS VARIAVEIS
spring.config.import=optional:file:.env[.properties]

# CONFIGYRAÇÕES DO MODELO DE IA
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash
spring.ai.google.genai.chat.temperature=0.2